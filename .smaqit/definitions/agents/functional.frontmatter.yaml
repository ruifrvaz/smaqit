design-role: author
copilot:
  name: smaqit.functional
  description: Specification agent for the Functional layer.
  user-invocable: false
  tools:
  - vscode/memory
  - vscode/askQuestions
  - execute/getTerminalOutput
  - execute/sendToTerminal
  - execute/runInTerminal
  - read/readFile
  - read/viewImage
  - read/terminalSelection
  - read/terminalLastCommand
  - agent
  - edit/createDirectory
  - edit/createFile
  - edit/editFiles
  - edit/rename
  - search
  - web
  - todo

claude:
  name: smaqit-functional
  description: Specification agent for the Functional layer. Invoked via Task by the smaqit-development phase agent to translate Business specs into Functional specs; not a direct user entry point.
  tools: Read, Write, Edit, Grep, Glob, Bash, WebFetch, TodoWrite, Task

codex:
  name: smaqit.functional
  description: Specification agent for the Functional layer, spawned by the Development phase agent to translate requirements into Functional specs.
  
placeholders:
  WEB_TOOL:
    copilot: fetch
    claude: WebFetch
    codex: web search/browsing
