name: Copilot Setup

on:
  workflow_dispatch:
  # This workflow is triggered automatically by the GitHub Copilot coding agent
  # before starting a new session, as configured in AGENTS.md

jobs:
  copilot-setup-steps:
    name: Setup smaqit Framework
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up mandatory Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download smaqit installer
        run: |
          echo "Downloading latest smaqit installer..."
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/ruifrvaz/smaqit/releases | grep "tag_name" | head -1 | cut -d '"' -f 4)
          echo "Latest version: $LATEST_RELEASE"
          
          # Determine platform
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          
          case "$OS" in
            linux) PLATFORM="linux_amd64" ;;
            darwin) 
              case "$ARCH" in
                arm64) PLATFORM="darwin_arm64" ;;
                *) PLATFORM="darwin_amd64" ;;
              esac
              ;;
            *) echo "Unsupported OS: $OS"; exit 1 ;;
          esac
          
          DOWNLOAD_URL="https://github.com/ruifrvaz/smaqit/releases/download/${LATEST_RELEASE}/smaqit_${PLATFORM}"
          echo "Downloading from: $DOWNLOAD_URL"
          
          curl -L -o smaqit "$DOWNLOAD_URL"
          chmod +x smaqit
          sudo install -m 0755 smaqit /usr/local/bin/smaqit
          
          echo "✓ Downloaded smaqit installer"

      - name: Install smaqit
        run: |
          smaqit --install-global
          if [ ! -d ".smaqit" ]; then
            smaqit init
          fi
          echo "✓ smaqit global payload and project scaffold are ready"

      - name: Validate installation
        run: |
          echo "Validating smaqit installation..."
          
          # Check for framework files
          if [ ! -d ".smaqit" ]; then
            echo "✗ Project state not found"
            exit 1
          fi
          
          # Check for agent files
          if [ ! -f "$HOME/.copilot/agents/smaqit.business.agent.md" ] || [ ! -d "$HOME/.agents/skills" ]; then
            echo "✗ Global agent or skill files not found"
            exit 1
          fi
          
          # Check smaqit status
          smaqit status || true
          
          echo "✓ Installation validated successfully"

      - name: Installation summary
        if: always()
        run: |
          echo "==================================="
          echo "smaqit Installation Summary"
          echo "==================================="
          
          if [ -d ".smaqit" ]; then
            echo "Status: ✓ Installed"
            
            echo ""
            echo "Available global agents:"
            ls -1 "$HOME/.copilot/agents"/smaqit.*.agent.md 2>/dev/null | sed 's|.*/||' | sed 's|.agent.md||' || echo "  (agents not found)"
            
            echo ""
            echo "GitHub Copilot can now use smaqit agents."
          else
            echo "Status: ✗ Not installed"
            echo ""
            echo "Installation failed. Please check the logs above."
            exit 1
          fi
