copilot:
  name: smaqit.development
  description: 'Use when the user asks to build, add, change, or fix application features or behavior. Runs the Development phase: Business, Functional, and Stack specifications, then a working, tested application.'
  tools:
  - vscode/askQuestions
  - execute/getTerminalOutput
  - execute/sendToTerminal
  - execute/runInTerminal
  - execute/runTests
  - read/problems
  - read/readFile
  - read/terminalSelection
  - read/terminalLastCommand
  - agent
  - edit/createDirectory
  - edit/createFile
  - edit/editFiles
  - edit/rename
  - search
  - web
  - todo

claude:
  name: smaqit-development
  description: Use proactively when the user asks to build, add, change, or fix application features or behavior in a smaqit project. Runs the Development phase — orchestrates the Business, Functional, and Stack specification agents, then builds a working, tested application. Pass the user's full request and any PHASE-PARAMETERS block already resolved. If the result starts with NEEDS-INPUT or REVIEW-REQUESTED, ask the user and resume this agent with their answers; never answer it yourself.
  tools: Read, Write, Edit, Grep, Glob, Bash, WebFetch, TodoWrite, Task
  skills:
  - smaqit.input-development

codex:
  name: smaqit.development
  description: 'Use when the user asks to build, add, change, or fix application features or behavior in a smaqit project. Runs the Development phase: spawns the Business, Functional, and Stack specification agents, then builds a working, tested application. Pass the user''s full request and any PHASE-PARAMETERS block already resolved. If the result starts with NEEDS-INPUT or REVIEW-REQUESTED, ask the user and invoke this agent again with their answers; never answer it yourself.'
  
placeholders:
  DELEGATE_SPEC_AGENT:
    copilot: invoke the spec agent using `runSubagent`
    claude: invoke the corresponding spec subagent via the Task tool
    codex: spawn the corresponding `smaqit.<layer>` Codex subagent
