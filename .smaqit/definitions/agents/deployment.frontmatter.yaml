copilot:
  name: smaqit.deployment
  description: Implementation agent for the Deployment phase.
  tools:
  - vscode/askQuestions
  - edit/editFiles
  - search
  - read/readFile
  - runCommands
  - read/problems
  - changes
  - execute/testFailure
  - execute/runTests
  - agent/runSubagent

claude:
  name: smaqit-deployment
  description: Use proactively when the user asks to deploy, redeploy, provision, or put a smaqit project online. Runs the Deployment phase — orchestrates the Infrastructure specification agent, then deploys through the resolved slot plan. Pass the user's full request and any PHASE-PARAMETERS block already resolved. If the result starts with NEEDS-INPUT or REVIEW-REQUESTED, ask the user and resume this agent with their answers; never answer it yourself.
  tools: Read, Write, Edit, Grep, Glob, Bash, Task
  skills:
  - smaqit.input-deployment

codex:
  name: smaqit.deployment
  description: Implementation agent for the Deployment phase that spawns the Infrastructure agent and deploys Infrastructure and Stack specs.
  
placeholders:
  DELEGATE_INFRASTRUCTURE:
    copilot: invoke `smaqit.infrastructure` using `runSubagent`
    claude: invoke the `smaqit-infrastructure` subagent via the Task tool
    codex: spawn the `smaqit.infrastructure` Codex subagent
