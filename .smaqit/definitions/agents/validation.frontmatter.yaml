copilot:
  name: smaqit.validation
  description: Implementation agent for the Validation phase.
  tools:
  - vscode/askQuestions
  - execute/getTerminalOutput
  - execute/sendToTerminal
  - execute/runInTerminal
  - execute/runTests
  - read/problems
  - read/readFile
  - read/terminalSelection
  - read/terminalLastCommand
  - agent
  - edit/createDirectory
  - edit/createFile
  - edit/editFiles
  - edit/rename
  - search
  - web
  - todo

claude:
  name: smaqit-validation
  description: Use proactively when the user asks to test, validate, or verify the deployed system of a smaqit project. Runs the Validation phase — orchestrates the Coverage specification agent, then generates and runs tests against the deployed system. Pass the user's full request and any PHASE-PARAMETERS block already resolved. If the result starts with NEEDS-INPUT or REVIEW-REQUESTED, ask the user and resume this agent with their answers; never answer it yourself.
  tools: Read, Write, Edit, Grep, Glob, Bash, WebFetch, TodoWrite, Task
  skills:
  - smaqit.input-validation

codex:
  name: smaqit.validation
  description: Implementation agent for the Validation phase that spawns the Coverage agent and executes tests against the deployed system.
  
placeholders:
  DELEGATE_COVERAGE:
    copilot: invoke `smaqit.coverage` using `runSubagent`
    claude: invoke the `smaqit-coverage` subagent via the Task tool
    codex: spawn the `smaqit.coverage` Codex subagent
