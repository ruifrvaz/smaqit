name: Installer Smoke Test

on:
  pull_request:
    paths:
      - '.smaqit/definitions/agents/**'
      - 'agents/**'
      - 'commands/**'
      - 'framework/**'
      - 'installer/**'
      - 'scripts/generate-agents.py'
      - 'scripts/smoke-test-installer.sh'
      - 'skills/**'
      - 'templates/**'
      - '.github/workflows/installer-smoke-test.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  installer-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: installer/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: python -m pip install PyYAML

      - name: Run unit and installer lifecycle tests
        run: |
          make -C installer test
          make -C installer smoke-test
